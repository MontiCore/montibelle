apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: montibelle-web-pod
  labels:
    service: code-server
spec:
  selector:
    matchLabels:
      app: montibelle-web-pod
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: montibelle-web-pod
    spec:
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: rwth-git-registry
      containers:
        # Code Server
        - image: registry.git.rwth-aachen.de/montibelle/frontend/tooling/mwe/codeserver/sysml:1.3.0
          name: code-server
          command: ["bash", "/start.sh"]
          imagePullPolicy: IfNotPresent
          env:
            - name: GIT_SSH_COMMAND
              value: "ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no" # Disable host key checking (because of the missing user prompt in the git extension)
          volumeMounts:
            - name: user-storage
              mountPath: /home/coder/workspace
              subPath: ive-home
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "12Gi"
              cpu: "4"
      volumes:
        # DO NOT MODIFY this volume. It is fully managed by the web app.
        - name: user-storage
          emptyDir: {}
